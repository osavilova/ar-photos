<!doctype html>
<!-- Reads the QR code from a layout PNG. Open: /tools/qr.html?img=work/maket.png -->
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<pre id="out">reading…</pre>
<script>
  const src = new URLSearchParams(location.search).get('img');
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const r = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
    document.getElementById('out').textContent = r
      ? 'QR: ' + r.data + '\nbox: ' + JSON.stringify(r.location.topLeftCorner) + ' → ' + JSON.stringify(r.location.bottomRightCorner)
      : 'QR NOT FOUND';
  };
  img.src = src;
</script>
